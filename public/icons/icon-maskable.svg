<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b21d4"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.18)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Full-bleed background — NO rounded corners baked in.
       Android/iOS apply their OWN mask shape (circle, squircle,
       rounded-square, teardrop) on top of this; pre-rounding here
       would create a double-rounded, gap-showing artifact. -->
  <rect width="512" height="512" fill="url(#g)"/>
  <rect width="512" height="512" fill="url(#shine)"/>

  <!-- Letter "A" — kept well inside the standard maskable safe
       zone (inner 80% diameter circle, i.e. centered, radius
       ~204px out of 256px half-width). Slightly smaller and
       higher than the "any"-purpose icon.svg to guarantee no
       clipping on aggressive circular masks. -->
  <text x="256" y="330"
    text-anchor="middle"
    font-family="Arial Black, Impact, sans-serif"
    font-size="240" font-weight="900"
    fill="white" opacity="0.95">A</text>

  <!-- Decorative squares moved inward, away from corners, so
       they survive any mask shape. -->
  <rect x="150" y="150" width="36" height="36" rx="7"
    fill="white" opacity="0.10"/>
  <rect x="326" y="326" width="36" height="36" rx="7"
    fill="white" opacity="0.10"/>
</svg>
