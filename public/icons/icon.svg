<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5b21d4"/>
      <stop offset="50%" style="stop-color:#7c3aed"/>
      <stop offset="100%" style="stop-color:#9333ea"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.2)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#g)"/>
  <!-- Shine overlay -->
  <rect width="512" height="512" rx="108" fill="url(#shine)"/>
  <!-- Letter A -->
  <text x="256" y="360"
    text-anchor="middle"
    font-family="Arial Black, Impact, sans-serif"
    font-size="300" font-weight="900"
    fill="white" opacity="0.95">A</text>
  <!-- Decorative squares -->
  <rect x="60" y="60" width="60" height="60" rx="10"
    fill="white" opacity="0.08"/>
  <rect x="392" y="392" width="60" height="60" rx="10"
    fill="white" opacity="0.08"/>
  <rect x="392" y="60" width="40" height="40" rx="8"
    fill="white" opacity="0.06"/>
</svg>
